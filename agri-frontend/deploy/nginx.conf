# Une seule origine pour tout : l'application (/) et l'API (/api/).
# Pas de CORS à gérer, et les cookies/stockages restent propres à la plateforme.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 8m;  # photos des diagnostics (5 Mo max côté API)

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;  # diagnostic IA et synthèse vocale
  }

  location = /health {
    proxy_pass http://api:8000/health;
  }

  # Fichiers versionnés par leur empreinte : cache d'un an
  # Ancienne adresse de l'espace agents, désormais intégré à l'application
  location /agents/ {
    return 301 /;
  }

  location ~ ^/assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker et pages d'entrée : toujours revalidés, pour que les mises à jour arrivent
  location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
