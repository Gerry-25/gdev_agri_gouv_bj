# En-têtes de sécurité, inclus dans chaque bloc qui ajoute ses propres en-têtes
# (nginx n'hérite pas des add_header du niveau supérieur dans ce cas).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
# Étape 2 : ajouter les serveurs de tuiles cartographiques à img-src et connect-src.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
