# En-têtes de sécurité, inclus dans chaque bloc qui ajoute ses propres en-têtes
# (nginx n'hérite pas des add_header du niveau supérieur dans ce cas).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Micro autorisé pour l'assistant vocal (questions posées à voix haute)
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self)" always;
# Carte : MapLibre utilise des web workers (blob:) ; les tuiles satellite viennent d'Esri.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://services.arcgisonline.com https://ibasemaps-api.arcgis.com; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://services.arcgisonline.com https://ibasemaps-api.arcgis.com; media-src 'self' blob:; worker-src 'self' blob:; child-src blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

