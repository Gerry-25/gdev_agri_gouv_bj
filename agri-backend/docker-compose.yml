services:
  api:
    build: .
    container_name: agri_fastapi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Remplace l'URL "localhost" du .env par le nom du service Docker
      MONGODB_URL: "mongodb://${MONGO_ROOT_USER:?MONGO_ROOT_USER manquant dans .env}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD manquant dans .env}@mongodb:27017/?authSource=admin"
    depends_on:
      mongodb:
        condition: service_healthy

  # Frontend : application terrain (/) et espace agents (/agents/), avec relais vers l'API.
  # Le dossier agri-frontend doit se trouver à côté de agri-backend.
  web:
    build: ../agri-frontend
    container_name: agri_web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  mongodb:
    image: mongo:7.0-jammy
    container_name: agri_mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER manquant dans .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD manquant dans .env}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - agri_mongo_data:/data/db

volumes:
  agri_mongo_data:
